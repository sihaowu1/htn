<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browser agents</title>
<style>
body { font: 14px system-ui; margin: 16px; } label { display: block; margin: 8px 0; }
input[type=url], textarea { width: min(700px, 95%); } textarea { height: 70px; }
pre { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 380px; overflow: auto; border: 1px solid #aaa; padding: 8px; }
#sessions { display: flex; flex-wrap: wrap; gap: 12px; } .session { width: 600px; max-width: 100%; }
iframe { width: 100%; height: 380px; border: 1px solid #aaa; } #error { color: #b00020; }
</style>
<h1>Browser agents</h1>
<p>Start your target website and paste its public tunnel URL. Discovery runs before task-specific workers.</p>
<form id="form">
<label>Target URL <input id="url" type="url" required placeholder="https://your-tunnel.example/"></label>
<label>Task <textarea id="prompt" required placeholder="Test search with matching and no-result queries. Stop at the results."></textarea></label>
<label>Maximum simultaneous workers <input id="workers" type="number" min="1" max="5" value="2" required></label>
<label>Optional flow-map JSON (bypass discovery) <input id="mapFile" type="file" accept=".json,application/json"></label>
<label><input id="singleAction" type="checkbox"> TEST SINGLE ACTION (REMOVE BEFORE DEMO)</label>
<button id="start">Start</button> <button id="stop" type="button" disabled>Stop</button>
</form>
<p id="error" role="alert"></p><p id="status">Idle</p>
<a id="download" hidden>Download flow map</a>
<details><summary>Flow tree and coverage</summary><pre id="tree">No discovery yet</pre></details>
<details><summary>Plan and skipped branches</summary><pre id="plan">No plan yet</pre></details>
<h2>Browsers</h2><div id="sessions"></div>
<h2>Observer</h2><pre id="findings">No findings yet</pre>
<h2>Results</h2><pre id="results">No results yet</pre>
<h2>Events</h2><pre id="events"></pre>
<script src="/app.js" defer></script>
</html>
