<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browser agents</title>
<style>
  * { box-sizing: border-box; }
  body { font: 14px system-ui; margin: 0; display: flex; height: 100vh; }
  nav { width: 160px; flex: none; border-right: 1px solid #aaa; padding: 12px 0; }
  nav button { display: flex; align-items: center; gap: 6px; width: 100%; text-align: left; background: none; border: none; padding: 10px 16px; font: inherit; cursor: pointer; }
  nav button.active { background: #eee; font-weight: bold; }
  /* TODO: light up .notif when a tab needs the user's attention (e.g. run finished, observer finding, error) */
  nav .notif { width: 8px; height: 8px; border-radius: 50%; background: #b00020; }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; padding: 16px; overflow: auto; }
  #error { color: #b00020; }
  h1 { font-size: 18px; margin: 0 0 8px; }
  .view { display: none; flex: 1; min-height: 0; flex-direction: column; }
  .view.active { display: flex; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; overflow: auto; border: 1px solid #aaa; padding: 8px; flex: 1; }
  #sessions { display: flex; flex-wrap: wrap; gap: 12px; overflow: auto; }
  .session { width: 600px; max-width: 100%; }
  iframe { width: 100%; height: 380px; border: 1px solid #aaa; }
  .chatbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border-top: 1px solid #aaa; padding-top: 8px; margin-top: 8px; }
  .chatbar input[type=url] { width: 220px; }
  .chatbar textarea { flex: 1; min-width: 200px; height: 32px; }
  .chatbar input[type=number] { width: 56px; }
</style>
<nav id="nav">
  <button data-view="browsers" class="active">Browsers <span class="notif" hidden></span></button>
  <button data-view="observer">Observer <span class="notif" hidden></span></button>
  <button data-view="results">Results <span class="notif" hidden></span></button>
  <button data-view="events">Events <span class="notif" hidden></span></button>
</nav>
<main>
  <p id="status">Idle</p>
  <p id="error" role="alert"></p>

  <section id="view-browsers" class="view active">
    <h1>Browsers</h1>
    <details><summary>Flow tree and coverage</summary><pre id="tree">No discovery yet</pre></details>
    <details><summary>Plan and skipped branches</summary><pre id="plan">No plan yet</pre></details>
    <a id="download" hidden>Download flow map</a>
    <div id="sessions"></div>
    <form id="form" class="chatbar">
      <input id="url" type="url" required placeholder="Target tunnel URL">
      <textarea id="prompt" required placeholder="Test search with matching and no-result queries. Stop at the results."></textarea>
      <label>Workers <input id="workers" type="number" min="1" max="5" value="2" required></label>
      <label>Flow map <input id="mapFile" type="file" accept=".json,application/json"></label>
      <button id="start">Start</button>
      <button id="stop" type="button" disabled>Stop</button>
    </form>
  </section>

  <section id="view-observer" class="view">
    <h1>Observer</h1>
    <pre id="findings">No findings yet</pre>
  </section>

  <section id="view-results" class="view">
    <h1>Results</h1>
    <pre id="results">No results yet</pre>
  </section>

  <section id="view-events" class="view">
    <h1>Events</h1>
    <pre id="events"></pre>
  </section>
</main>
<script src="/app.js" defer></script>
</html>
