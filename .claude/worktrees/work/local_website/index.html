<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BestBuy Mock - Online Store</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <nav class="category-nav" id="category-nav"></nav>

  <main>
    <div class="breadcrumb" id="results-label"></div>
    <div class="product-grid" id="product-grid"></div>
    <div class="empty-state" id="empty-state" hidden>No products found. Try a different search or category.</div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="products.js"></script>
  <script src="app.js"></script>
  <script>
    function getParams() {
      return new URLSearchParams(window.location.search);
    }

    function renderProducts() {
      const params = getParams();
      const q = (params.get("q") || "").trim().toLowerCase();
      const category = params.get("category") || "All";

      renderHeader(category);

      let results = PRODUCTS.filter((p) => category === "All" || p.category === category);
      if (q) {
        results = results.filter(
          (p) => p.name.toLowerCase().includes(q) || p.category.toLowerCase().includes(q)
        );
      }

      const label = document.getElementById("results-label");
      if (q) {
        label.textContent = `Search results for "${q}" (${results.length})`;
      } else {
        label.textContent = `${category} (${results.length})`;
      }

      const grid = document.getElementById("product-grid");
      const emptyState = document.getElementById("empty-state");

      if (results.length === 0) {
        grid.innerHTML = "";
        emptyState.hidden = false;
        return;
      }
      emptyState.hidden = true;

      grid.innerHTML = results
        .map(
          (p) => `
        <a class="product-card" href="product.html?id=${p.id}" data-testid="product-card-${p.id}">
          ${productThumbHtml(p)}
          <div class="product-name">${p.name}</div>
          <div class="product-rating">★ ${p.rating.toFixed(1)}</div>
          <div class="product-price">${formatPrice(p.price)}</div>
        </a>
      `
        )
        .join("");
    }

    renderProducts();
  </script>
</body>
</html>
