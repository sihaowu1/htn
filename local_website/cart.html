<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your Cart - BestBuy Mock</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <nav class="category-nav" id="category-nav"></nav>

  <main>
    <h1>Your Cart</h1>
    <div id="cart-content"></div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="products.js"></script>
  <script src="app.js"></script>
  <script>
    function renderCartPage() {
      renderHeader("All");
      const cart = getCart();
      const entries = Object.entries(cart).filter(([id]) => findProduct(id));
      const content = document.getElementById("cart-content");

      if (entries.length === 0) {
        content.innerHTML = `<div class="empty-state">Your cart is empty. <a href="index.html">Continue shopping</a></div>`;
        return;
      }

      const itemsHtml = entries
        .map(([id, qty]) => {
          const p = findProduct(id);
          return `
          <div class="cart-item" data-testid="cart-item-${id}">
            ${productThumbHtml(p)}
            <div class="cart-item-info">
              <div class="product-name"><a href="product.html?id=${id}">${p.name}</a></div>
              <div class="product-price">${formatPrice(p.price)}</div>
              <div class="qty-row">
                <label for="qty-${id}">Qty</label>
                <input type="number" id="qty-${id}" min="1" max="10" value="${qty}" data-id="${id}" class="qty-input" />
                <button class="remove-link" data-id="${id}">Remove</button>
              </div>
            </div>
          </div>
        `;
        })
        .join("");

      const total = cartTotal();

      content.innerHTML = `
        <div>${itemsHtml}</div>
        <div class="cart-summary">
          <div class="summary-row"><span>Items (${cartCount()})</span><span>${formatPrice(total)}</span></div>
          <div class="summary-row"><span>Shipping</span><span>Free</span></div>
          <div class="summary-row total"><span>Total</span><span id="cart-total">${formatPrice(total)}</span></div>
          <a class="btn yellow" style="display:block; text-align:center; margin-top:1rem;" href="checkout.html">Checkout</a>
        </div>
      `;

      content.querySelectorAll(".qty-input").forEach((input) => {
        input.addEventListener("change", (e) => {
          const id = e.target.dataset.id;
          let qty = parseInt(e.target.value, 10);
          if (!Number.isFinite(qty) || qty < 1) qty = 1;
          setCartQty(id, qty);
          renderCartPage();
        });
      });

      content.querySelectorAll(".remove-link").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          removeFromCart(e.target.dataset.id);
          renderCartPage();
        });
      });
    }

    renderCartPage();
  </script>
</body>
</html>
