<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Product - BestBuy Mock</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <nav class="category-nav" id="category-nav"></nav>

  <main id="main-content"></main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="products.js"></script>
  <script src="app.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const product = findProduct(params.get("id"));
    const main = document.getElementById("main-content");

    if (!product) {
      renderHeader("All");
      main.innerHTML = `<div class="empty-state">Product not found. <a href="index.html">Back to store</a></div>`;
    } else {
      renderHeader(product.category);
      const defaultVariant = findVariant(product);

      main.innerHTML = `
        <div class="breadcrumb">
          <a href="index.html">Home</a> /
          <a href="index.html?category=${encodeURIComponent(product.category)}">${product.category}</a> /
          ${product.name}
        </div>
        <div class="product-detail">
          <div>
            <div id="product-visual">${productThumbHtml(product, "", defaultVariant)}</div>
            <div class="variant-panel">
              <div class="variant-heading"><strong>Color</strong><span id="selected-color">${defaultVariant.name}</span></div>
              <div class="variant-options" role="radiogroup" aria-label="Choose a color">
                ${product.variants.map((variant) => `
                  <button class="variant-option${variant.id === defaultVariant.id ? " selected" : ""}" type="button" role="radio" aria-checked="${variant.id === defaultVariant.id}" data-variant-id="${variant.id}" title="${variant.name}${variant.popular ? " - Most popular" : ""}">
                    <span class="color-swatch" style="background:${variant.hex}"></span>
                    <span>${variant.name}</span>
                    ${variant.popular ? '<small>Most popular</small>' : ""}
                  </button>
                `).join("")}
              </div>
            </div>
          </div>
          <div>
            <h1>${product.name}</h1>
            <div class="product-rating">★ ${product.rating.toFixed(1)} rating</div>
            <p>${product.blurb}</p>
            <div class="product-price" id="unit-price">${formatPrice(defaultVariant.price)}</div>

            <div class="qty-row">
              <label for="qty">Qty</label>
              <input type="number" id="qty" value="1" min="1" max="10" />
              <button class="btn" id="add-to-cart-btn">Add to Cart</button>
            </div>
            <div id="add-confirmation" style="display:none; color: #1a7a1a; font-weight:600;">Added to cart.</div>

            <a class="btn secondary" href="cart.html" style="margin-top:1rem; display:inline-block;">View Cart</a>
          </div>
        </div>
      `;

      let selectedVariant = defaultVariant;
      document.querySelectorAll(".variant-option").forEach((button) => {
        button.addEventListener("click", () => {
          selectedVariant = findVariant(product, button.dataset.variantId);
          document.getElementById("product-visual").innerHTML = productThumbHtml(product, "", selectedVariant);
          document.getElementById("unit-price").textContent = formatPrice(selectedVariant.price);
          document.getElementById("selected-color").textContent = selectedVariant.name;
          document.querySelectorAll(".variant-option").forEach((option) => {
            const isSelected = option === button;
            option.classList.toggle("selected", isSelected);
            option.setAttribute("aria-checked", String(isSelected));
          });
        });
      });

      document.getElementById("add-to-cart-btn").addEventListener("click", () => {
        const qtyInput = document.getElementById("qty");
        let qty = parseInt(qtyInput.value, 10);
        if (!Number.isFinite(qty) || qty < 1) qty = 1;
        addToCart(getCartItemKey(product.id, selectedVariant.id), qty);
        document.getElementById("cart-count").textContent = cartCount();
        const conf = document.getElementById("add-confirmation");
        conf.style.display = "block";
      });
    }
  </script>
</body>
</html>
