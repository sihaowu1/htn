<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checkout - BestBuy Mock</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <nav class="category-nav" id="category-nav"></nav>

  <main>
    <h1>Checkout</h1>
    <div id="checkout-content"></div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="products.js"></script>
  <script src="app.js"></script>
  <script>
    function renderCheckout() {
      renderHeader("All");
      const cart = getCart();
      const entries = Object.entries(cart).filter(([key]) => parseCartItemKey(key) || findProduct(key));
      const content = document.getElementById("checkout-content");

      if (entries.length === 0) {
        content.innerHTML = `<div class="empty-state">Your cart is empty. <a href="index.html">Continue shopping</a></div>`;
        return;
      }

      const user = getCurrentUser();
      if (!user) {
        content.innerHTML = `
          <div class="auth-required">
            <h2>Sign in to continue</h2>
            <p>Your cart is saved. Sign in or create an account before checkout.</p>
            <a class="btn yellow" href="${authUrl("checkout.html")}">Sign in or create an account</a>
          </div>
        `;
        return;
      }

      const total = cartTotal();
      const summaryRows = entries
        .map(([key, qty]) => {
          const item = parseCartItemKey(key) || { product: findProduct(key), variant: null };
          const p = item.product;
          const variant = item.variant;
          const price = variant?.price || p.price;
          return `<div class="summary-row"><span>${p.name}${variant ? ` (${variant.name})` : ""} × ${qty}</span><span>${formatPrice(price * qty)}</span></div>`;
        })
        .join("");

      content.innerHTML = `
        <div class="checkout-grid">
          <div class="form-card">
            <h2>Shipping Information</h2>
            <form id="checkout-form">
              <div class="form-row">
                <label for="fullname">Full name</label>
                <input type="text" id="fullname" name="fullname" required />
              </div>
              <div class="form-row">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required />
              </div>
              <div class="form-row">
                <label for="address">Address</label>
                <input type="text" id="address" name="address" required />
              </div>
              <div class="form-row-pair">
                <div class="form-row">
                  <label for="city">City</label>
                  <input type="text" id="city" name="city" required />
                </div>
                <div class="form-row">
                  <label for="zip">ZIP code</label>
                  <input type="text" id="zip" name="zip" required />
                </div>
              </div>
              <h2>Payment</h2>
              <div class="form-row">
                <label for="cardnum">Card number</label>
                <input type="text" id="cardnum" name="cardnum" placeholder="4242 4242 4242 4242" required />
              </div>
              <div class="form-row-pair">
                <div class="form-row">
                  <label for="expiry">Expiry</label>
                  <input type="text" id="expiry" name="expiry" placeholder="MM/YY" required />
                </div>
                <div class="form-row">
                  <label for="cvc">CVC</label>
                  <input type="text" id="cvc" name="cvc" placeholder="123" required />
                </div>
              </div>
              <button type="submit" class="btn yellow" id="place-order-btn">Place Order</button>
            </form>
          </div>
          <div class="order-summary-card">
            <h2>Order Summary</h2>
            ${summaryRows}
            <div class="summary-row"><span>Shipping</span><span>Free</span></div>
            <div class="summary-row total"><span>Total</span><span>${formatPrice(total)}</span></div>
          </div>
        </div>
      `;

      document.getElementById("checkout-form").addEventListener("submit", (e) => {
        e.preventDefault();
        const orderNumber = "BB-" + Math.floor(100000 + Math.random() * 900000);
        saveCart({});
        content.innerHTML = `
          <div class="confirmation" data-testid="order-confirmation">
            <h1>Thank you for your order!</h1>
            <p>Your order number is <strong>${orderNumber}</strong>.</p>
            <p>A confirmation email would be sent to you in a real store.</p>
            <a class="btn" href="index.html">Continue Shopping</a>
          </div>
        `;
        document.getElementById("cart-count").textContent = cartCount();
      });
    }

    renderCheckout();
  </script>
</body>
</html>
