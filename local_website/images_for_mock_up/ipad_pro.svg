<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">AeroPad Pro 12.9</title>
  <desc id="desc">A thin blue tablet standing at an angle with a luminous abstract display.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eaf2f7"/><stop offset="1" stop-color="#a7b6c7"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#0e4b8d"/><stop offset=".5" stop-color="#5ec6e6"/><stop offset="1" stop-color="#d7f4ff"/></linearGradient>
    <filter id="shadow"><feGaussianBlur stdDeviation="24"/></filter>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <ellipse cx="610" cy="760" rx="300" ry="42" fill="#43566d" opacity=".35" filter="url(#shadow)"/>
  <g transform="translate(390 70) rotate(13 230 360)">
    <rect x="40" y="20" width="390" height="700" rx="40" fill="#183d68"/>
    <rect x="62" y="43" width="346" height="654" rx="22" fill="url(#screen)"/>
    <circle cx="235" cy="32" r="7" fill="#0a203d"/>
    <circle cx="235" cy="710" r="8" fill="#a9d4e5"/>
  </g>
</svg>
