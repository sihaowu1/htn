<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">AeroPad Mini</title>
  <desc id="desc">A compact rose-colored tablet floating over a soft studio background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5eff0"/><stop offset="1" stop-color="#cbbbc1"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#6f2f66"/><stop offset=".5" stop-color="#ea6d91"/><stop offset="1" stop-color="#ffd08a"/></linearGradient>
    <filter id="shadow"><feGaussianBlur stdDeviation="20"/></filter>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <ellipse cx="600" cy="725" rx="280" ry="38" fill="#704e5c" opacity=".28" filter="url(#shadow)"/>
  <g transform="translate(420 120) rotate(-18 180 280)">
    <rect x="30" y="20" width="350" height="570" rx="38" fill="#8d526d"/>
    <rect x="52" y="43" width="306" height="524" rx="22" fill="url(#screen)"/>
    <circle cx="205" cy="32" r="6" fill="#4a203d"/>
    <circle cx="205" cy="578" r="7" fill="#f0c4d0"/>
  </g>
</svg>
