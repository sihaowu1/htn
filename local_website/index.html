<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BestBuy Mock - Online Store</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header" id="site-header"></header>
  <nav class="category-nav" id="category-nav"></nav>

  <main>
    <div class="breadcrumb" id="results-label"></div>
    <div class="search-suggestion" id="search-suggestion" hidden></div>
    <div class="product-grid" id="product-grid"></div>
    <div class="empty-state" id="empty-state" hidden>No products found. Try a different search or category.</div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="products.js"></script>
  <script src="app.js"></script>
  <script>
    function getParams() {
      return new URLSearchParams(window.location.search);
    }

    function editDistance(left, right) {
      const distances = Array.from({ length: right.length + 1 }, (_, index) => index);

      for (let leftIndex = 1; leftIndex <= left.length; leftIndex += 1) {
        let diagonal = distances[0];
        distances[0] = leftIndex;

        for (let rightIndex = 1; rightIndex <= right.length; rightIndex += 1) {
          const above = distances[rightIndex];
          const cost = left[leftIndex - 1] === right[rightIndex - 1] ? 0 : 1;
          distances[rightIndex] = Math.min(
            distances[rightIndex] + 1,
            distances[rightIndex - 1] + 1,
            diagonal + cost
          );
          diagonal = above;
        }
      }

      return distances[right.length];
    }

    function searchableTerms(product) {
      return [product.name, product.category, ...(product.searchTerms || [])]
        .map((term) => term.toLowerCase());
    }

    function findSuggestion(query) {
      const terms = [...new Set(PRODUCTS.flatMap(searchableTerms))];
      const maxDistance = query.length < 5 ? 1 : 2;
      return terms
        .map((term) => ({ term, distance: editDistance(query, term) }))
        .filter(({ term, distance }) => distance <= maxDistance && term !== query)
        .sort((left, right) => left.distance - right.distance || left.term.length - right.term.length)[0]?.term;
    }

    function renderProducts() {
      const params = getParams();
      const q = (params.get("q") || "").trim().toLowerCase();
      const category = params.get("category") || "All";
      const suggestion = document.getElementById("search-suggestion");

      renderHeader(category);

      let results = PRODUCTS.filter((p) => category === "All" || p.category === category);
      if (q) {
        results = results.filter(
          (p) => searchableTerms(p).some((term) => term.includes(q))
        );
      }

      const correctedQuery = !results.length && q ? findSuggestion(q) : "";
      if (correctedQuery) {
        results = PRODUCTS.filter((p) => category === "All" || p.category === category).filter(
          (p) => searchableTerms(p).some((term) => term.includes(correctedQuery))
        );
        suggestion.hidden = false;
        suggestion.textContent = `Did you mean "${correctedQuery}"?`;
      } else {
        suggestion.hidden = true;
        suggestion.textContent = "";
      }

      const label = document.getElementById("results-label");
      if (q) {
        label.textContent = `Search results for "${correctedQuery || q}" (${results.length})`;
      } else {
        label.textContent = `${category} (${results.length})`;
      }

      const grid = document.getElementById("product-grid");
      const emptyState = document.getElementById("empty-state");

      if (results.length === 0) {
        grid.innerHTML = "";
        emptyState.hidden = false;
        return;
      }
      emptyState.hidden = true;

      grid.innerHTML = results
        .map(
          (p) => `
        <a class="product-card" href="product.html?id=${p.id}" data-testid="product-card-${p.id}">
          ${productThumbHtml(p)}
          <div class="product-name">${p.name}</div>
          <div class="product-rating">★ ${p.rating.toFixed(1)}</div>
          <div class="product-price">${formatPrice(p.price)}</div>
        </a>
      `
        )
        .join("");
    }

    renderProducts();
  </script>
</body>
</html>
